<!DOCTYPE html>
<html>
<head>
  <title>DesignAI - End-to-End Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a1a; color: #e0e0e0; padding: 24px; }
    h1 { color: #7c3aed; margin-bottom: 8px; }
    h2 { color: #a78bfa; font-size: 18px; margin: 24px 0 12px; }
    .status { padding: 12px 16px; border-radius: 8px; margin: 8px 0; font-family: monospace; font-size: 14px; }
    .pass { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }
    .fail { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .info { background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.3); color: #a78bfa; }
    .running { background: rgba(234,179,8,0.15); border: 1px solid rgba(234,179,8,0.3); color: #fbbf24; }
    button { background: linear-gradient(135deg, #7c3aed, #06b6d4); color: #fff; border: none; padding: 14px 28px; border-radius: 12px; font-size: 16px; cursor: pointer; margin: 16px 0; font-weight: 600; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    img { max-width: 400px; border-radius: 12px; margin: 8px; border: 2px solid rgba(255,255,255,0.1); }
    .images { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    .img-label { text-align: center; }
    .img-label span { display: block; margin-top: 8px; font-weight: 600; font-size: 14px; color: #a78bfa; }
    #fileInput { margin: 12px 0; }
    .progress { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 8px 0; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #7c3aed, #06b6d4); transition: width 0.3s; }
  </style>
</head>
<body>
  <h1>🧪 DesignAI End-to-End Test Suite</h1>
  <p style="color:#888; margin-bottom: 20px;">Tests the complete AI Room Transformation pipeline</p>

  <h2>1. Backend Health Check</h2>
  <div id="health" class="status info">⏳ Click "Run All Tests" to start...</div>

  <h2>2. Upload & Transform</h2>
  <input type="file" id="fileInput" accept="image/*" />
  <select id="styleSelect" style="background:#1a1a2e; color:#e0e0e0; border:1px solid #333; padding:8px 12px; border-radius:8px; font-size:14px;">
    <option value="Modern">Modern</option>
    <option value="Minimalist">Minimalist</option>
    <option value="Luxury">Luxury</option>
    <option value="Scandinavian">Scandinavian</option>
    <option value="Industrial">Industrial</option>
    <option value="Contemporary">Contemporary</option>
    <option value="Bohemian">Bohemian</option>
    <option value="Coastal">Coastal</option>
  </select>
  <br/>
  <button id="runBtn" onclick="runAllTests()">🚀 Run All Tests</button>
  <div id="uploadResult" class="status info" style="display:none;"></div>
  <div class="progress" id="progressBar" style="display:none;"><div class="progress-bar" id="progressFill" style="width:0%"></div></div>

  <h2>3. Results</h2>
  <div id="results"></div>
  <div class="images" id="imageResults"></div>

  <h2>4. Download Test</h2>
  <div id="downloadResult" class="status info" style="display:none;"></div>

  <h2>5. Summary</h2>
  <div id="summary" class="status info" style="display:none;"></div>

  <script>
    const API = 'http://localhost:8000';
    const API_V1 = `${API}/api/v1`;
    let generatedUrl = null;
    let originalUrl = null;

    function log(id, msg, type = 'info') {
      const el = document.getElementById(id);
      el.style.display = 'block';
      el.className = `status ${type}`;
      el.textContent = msg;
    }

    async function runAllTests() {
      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Running tests...';

      let passed = 0, failed = 0;

      // Test 1: Health Check
      try {
        log('health', '⏳ Checking backend health...', 'running');
        const res = await fetch(`${API}/health`, { signal: AbortSignal.timeout(5000) });
        const data = await res.json();
        if (data.status === 'ok') {
          log('health', `✅ Backend healthy: ${JSON.stringify(data)}`, 'pass');
          passed++;
        } else {
          throw new Error('Unexpected response');
        }
      } catch (e) {
        log('health', `❌ Backend unreachable: ${e.message}`, 'fail');
        failed++;
        log('summary', `❌ Backend is not running on port 8000. Start it first!`, 'fail');
        btn.disabled = false;
        btn.textContent = '🚀 Run All Tests';
        return;
      }

      // Test 2: Upload & Generate
      const fileInput = document.getElementById('fileInput');
      const style = document.getElementById('styleSelect').value;

      if (!fileInput.files[0]) {
        log('uploadResult', '⚠️ No file selected. Please choose a room image first.', 'fail');
        failed++;
      } else {
        try {
          log('uploadResult', `⏳ Uploading and generating ${style} design...`, 'running');
          document.getElementById('progressBar').style.display = 'block';
          document.getElementById('progressFill').style.width = '20%';

          const formData = new FormData();
          formData.append('file', fileInput.files[0]);
          formData.append('style', style);
          formData.append('room_type', 'Living Room');

          document.getElementById('progressFill').style.width = '40%';

          const res = await fetch(`${API_V1}/designs/demo-generate`, {
            method: 'POST',
            body: formData,
          });

          document.getElementById('progressFill').style.width = '80%';

          if (res.ok) {
            const data = await res.json();
            originalUrl = data.original_url;
            generatedUrl = data.generated_url;

            document.getElementById('progressFill').style.width = '100%';
            log('uploadResult', `✅ Generation complete! Style: ${data.style}, Room: ${data.room_type}`, 'pass');
            passed++;

            // Display images
            const imgDiv = document.getElementById('imageResults');
            imgDiv.innerHTML = `
              <div class="img-label">
                <img src="${originalUrl}" alt="Original" />
                <span>📷 Original Upload</span>
              </div>
              <div class="img-label">
                <img src="${generatedUrl}" alt="Generated" />
                <span>✨ AI ${style} Redesign</span>
              </div>
            `;

            log('results', `✅ Original: ${originalUrl}\n✅ Generated: ${generatedUrl}`, 'pass');
          } else {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${res.status}`);
          }
        } catch (e) {
          log('uploadResult', `❌ Generation failed: ${e.message}`, 'fail');
          document.getElementById('progressFill').style.width = '0%';
          failed++;
        }
      }

      // Test 3: Download
      if (generatedUrl) {
        try {
          const res = await fetch(generatedUrl);
          if (res.ok) {
            const blob = await res.blob();
            log('downloadResult', `✅ Download works! File size: ${(blob.size / 1024).toFixed(1)} KB, Type: ${blob.type}`, 'pass');
            passed++;
          } else {
            throw new Error(`HTTP ${res.status}`);
          }
        } catch (e) {
          log('downloadResult', `❌ Download failed: ${e.message}`, 'fail');
          failed++;
        }
      }

      // Summary
      const total = passed + failed;
      if (failed === 0) {
        log('summary', `🎉 All ${total} tests passed! AI Room Transformation is fully functional.`, 'pass');
      } else {
        log('summary', `${passed}/${total} tests passed, ${failed} failed.`, failed > 0 ? 'fail' : 'pass');
      }

      btn.disabled = false;
      btn.textContent = '🚀 Run All Tests';
    }
  </script>
</body>
</html>
